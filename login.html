<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Antrian Rumah Sakit</title>
  <link rel="stylesheet" href="css/login.css" />
  <script src="dist/login.js" defer></script>
</head>
<body>
  <main class="card">
    <div class="brand">
      <div class="logo" aria-hidden="true">+</div>
      <h1>Antrian Rumah Sakit</h1>
      <p class="subtitle">Masuk untuk mengelola antrian</p>
    </div>

    <div id="error-box" class="error" role="alert" hidden></div>

    <form id="login-form" novalidate>
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" placeholder="mis. emilys" required autofocus />

      <label for="password">Password</label>
      <div class="pw-wrap">
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Masukkan password" required />
        <button type="button" id="toggle-pw" class="toggle" aria-pressed="false">Tampilkan</button>
      </div>

      <button type="submit" id="submit-btn" class="btn">
        <span id="spinner" class="spinner" hidden></span>
        <span id="btn-text">Masuk</span>
      </button>
    </form>

    <div class="public-links">
      <p>Tanpa login:</p>
      <a href="ambil-antrian.html">Ambil Antrian</a>
      <a href="layar.html">Layar Antrian</a>
    </div>
  </main>
</body>
</html>
